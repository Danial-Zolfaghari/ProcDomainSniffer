name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v0.1.0"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tests
        if: steps.meta.outputs.exists != 'true'
        run: dotnet restore .\ProcDomainSniffer.Tests\ProcDomainSniffer.Tests.csproj

      - name: Unit tests
        if: steps.meta.outputs.exists != 'true'
        run: dotnet test .\ProcDomainSniffer.Tests\ProcDomainSniffer.Tests.csproj -c Release --no-restore

      - name: Publish application
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: .\build-gui.ps1

      - name: Create checksum
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: |
          $file = './output/ProcDomainSniffer.GUI.exe'
          if (-not (Test-Path $file)) { throw 'ProcDomainSniffer.GUI.exe is missing.' }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ProcDomainSniffer.GUI.exe" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes ./output/ProcDomainSniffer.GUI.exe ./SHA256SUMS.txt
